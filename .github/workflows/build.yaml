name: Build and release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"
    # A push to main runs this workflow, and so can publish, only when it
    # changes the Dockerfile: merging documentation or GitHub Actions updates
    # releases nothing. Those changes are linted and verified on their pull
    # request, which has no filter; a direct push to main that leaves the
    # Dockerfile alone runs neither. GitHub does not apply path filters to tag
    # pushes, so the manual tag path is unaffected.
    paths:
      - Dockerfile

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  # Only pull request runs are superseded. A main or tag run may be mid-release
  # (per-platform digests pushed, manifest list or git tag not yet), and
  # cancelling it there leaves a half-published release. Queued runs still
  # collapse to the newest, so a burst of merges costs one extra run, not one
  # run per merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default. The `tag` job alone is granted contents: write, to record
# an automatic release as a git tag; the pipeline's other credential is the
# Docker Hub token.
permissions:
  contents: read

env:
  REGISTRY_IMAGE: ivuorinen/docker-xmrig

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes to the repo, and the checkout is part of the
          # docker build context. Don't leave the job token in .git/config.
          persist-credentials: false
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile
      # Runs shellcheck over every `run:` block, which is what the
      # `# shellcheck disable=SC2046` directive in the merge job assumes exists.
      # The release pipeline's shell is where a quoting mistake silently
      # mis-tags a published image, so it is worth gating.
      #
      # actionlint v1.7.12. The version sits here, not as a trailing `# v1.7.12`
      # on the uses: line, because that line would then exceed .editorconfig's
      # 120 columns; Renovate tracks a docker:// ref by its digest alone and
      # never read that comment.
      - name: Lint workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      # The two manifests README tells users to apply verbatim were the only
      # tracked files no job ever opened. Both checks below are schema-aware on
      # purpose — a plain YAML parse accepts `read_onli:` and
      # `readOnlyRootFileSystem:` happily, and the manifest still reads as
      # hardened while the setting is gone.
      #
      # Compose validates its own schema: an unknown service or limits key exits
      # 1 with "additional properties '<key>' not allowed". Nothing extra needed.
      - name: Validate Compose file
        run: docker compose -f docker-compose.yml config --quiet
      # kubectl is the opposite — it accepts unknown fields and silently drops
      # them, so a one-character typo in securityContext applies cleanly and the
      # pod runs unhardened. -strict is what turns that into a failure here;
      # without it kubeconform reports this file valid with the typo in place.
      #
      # kubeconform v0.8.0 — version noted here for the same reason as
      # actionlint's above.
      - name: Validate Kubernetes manifests
        uses: docker://ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
        with:
          args: -strict -summary deployment.yaml

  # Gates publication. Builds each published platform on a native runner, then
  # actually runs the binary — this is what catches an empty XMRIG_VERSION, a
  # broken donate.h patch, or a runtime shared-library break, none of which a
  # manifest inspection can see. Both platforms in `build` must appear here, or
  # half the manifest list ships with only the check this comment calls
  # insufficient.
  verify:
    needs:
      - lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes to the repo, and the checkout is part of the
          # docker build context. Don't leave the job token in .git/config.
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build for test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: xmrig:ci
          # The xmrig compile is the entire cost of this image (~2 min at -j8,
          # several on a hosted runner); everything else is seconds. `build`
          # reuses this via the same scope, so a release compiles twice rather
          # than four times. Per-platform scope is required — without it the two
          # matrix legs share one key and evict each other every run.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Smoke test
        run: |
          expected="$(sed -n 's/^ARG XMRIG_VERSION="v\{0,1\}\([^"]*\)"/\1/p' Dockerfile)"
          test -n "$expected" || { echo "could not read XMRIG_VERSION from Dockerfile"; exit 1; }
          out="$(docker run --rm xmrig:ci /bin/xmrig --version)"
          echo "$out"
          # Exact field comparison, not `grep -q "$expected"`: the version
          # contains dots that a regex treats as wildcards, and an unanchored
          # match would accept 6.22.21 as "6.22.2".
          actual="$(printf '%s\n' "$out" | awk '$1 == "XMRig" { print $2; exit }')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::built binary is XMRig '${actual}', expected '${expected}' — check the builder-stage ARG"
            exit 1
          fi
      # `--version` overrides CMD, so the above never reads config.json, never
      # starts the HTTP API and never exercises the HEALTHCHECK. This does: it
      # runs the image exactly as shipped and pins the CMD, the config, the
      # :8080 API, the HEALTHCHECK, and the read-only/no-capability posture —
      # everything deployment.yaml's probes and securityContext depend on.
      - name: Smoke test the image as shipped
        run: |
          # These three flags are not decoration: deployment.yaml,
          # docker-compose.yml and the README recipe all apply them, and until
          # they were added here the posture was asserted in three manifests and
          # executed in none. A future xmrig that writes one file to / at startup
          # would break every real deployment while CI stayed green.
          cid="$(docker run -d --read-only --cap-drop ALL --security-opt no-new-privileges xmrig:ci)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 30); do
            docker exec "$cid" sh -c 'wget -qO- http://127.0.0.1:8080/2/summary' \
              >/tmp/summary.json 2>/dev/null && break
            sleep 1
          done
          if [ ! -s /tmp/summary.json ]; then
            echo "::error::image did not serve /2/summary within 30s — config.json rejected, or built without WITH_HTTP"
            docker logs "$cid"
            exit 1
          fi
          # xmrig pretty-prints its JSON, so match whitespace-tolerantly rather
          # than assuming a compact `"restricted":true`.
          grep -qE '"restricted"[[:space:]]*:[[:space:]]*true' /tmp/summary.json || {
            echo "::error::HTTP API is not in restricted mode"
            cat /tmp/summary.json
            exit 1
          }
          # The donate.h patch, proven in the running binary rather than in the
          # source text the builder stage greps. config.json asks for
          # donate-level 0, but xmrig ignores any level below kMinimumDonateLevel
          # and keeps kDefaultDonateLevel — so an unpatched binary reports 1 here
          # and only a patched one reports 0. Renovate automerges xmrig bumps, so
          # this is the check that stands between an upstream refactor of the
          # donation code and a published image that donates. A missing field
          # compares null == 0, which fails too.
          jq -e '.donate_level == 0' /tmp/summary.json >/dev/null || {
            echo "::error::donate_level is not 0 — the donate.h patch did not take effect"
            cat /tmp/summary.json
            exit 1
          }
          # The container's own HEALTHCHECK command, read back out of the image
          # rather than restated here — a hardcoded copy is only verbatim until
          # someone edits the Dockerfile. Element 0 of .Config.Healthcheck.Test
          # is the type marker ("CMD"), so drop it and exec the rest.
          mapfile -t hc < <(docker inspect -f '{{json .Config.Healthcheck.Test}}' xmrig:ci | jq -r '.[1:][]')
          test "${#hc[@]}" -gt 0 || {
            echo "::error::image declares no HEALTHCHECK — the Dockerfile instruction was dropped"; exit 1; }
          printf 'running healthcheck:'; printf ' %q' "${hc[@]}"; echo
          # docker exec does not inherit HEALTHCHECK --timeout, and busybox wget
          # waits 900s by default — a stalled request would park this step until
          # the job timeout. Enforce the image's own timeout, read from the image
          # for the same reason the argv above is: a hardcoded 5s here would be a
          # second copy of a constant the Dockerfile already owns.
          #
          # `{{json .Config.Healthcheck.Timeout}}`, NOT `{{.Config.Healthcheck.Timeout}}`
          # — the latter renders the Go duration's String(), giving "5s", which
          # is not arithmetic and quietly yields an empty $secs. json gives the
          # raw nanoseconds. A bad parse is an error, not a default: silently
          # falling back is what hid this exact bug during review.
          ns="$(docker inspect -f '{{json .Config.Healthcheck.Timeout}}' xmrig:ci)"
          case "$ns" in
            ''|*[!0-9]*)
              echo "::error::could not read HEALTHCHECK timeout from the image (got '${ns}')"; exit 1 ;;
          esac
          secs=$(( ns / 1000000000 ))
          # 0 means the Dockerfile set no --timeout; Docker's documented default
          # is 30s. Say so rather than pass `timeout 0s`, which GNU coreutils
          # reads as no limit at all.
          if [ "$secs" -le 0 ]; then
            echo "image declares no HEALTHCHECK timeout; using Docker's 30s default"
            secs=30
          fi
          # `|| rc=$?` keeps the failure out of set -e's hands so rc survives.
          rc=0
          timeout "${secs}s" docker exec "$cid" "${hc[@]}" || rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "::error::HEALTHCHECK exceeded the image's own ${secs}s timeout"
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::HEALTHCHECK command failed inside the image (exit ${rc})"
            exit 1
          fi
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: xmrig:ci
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  # Decides whether this run publishes, and under which tag. Runs beside
  # `verify` rather than after it: it reads only git and Docker Hub's tag list,
  # and `build` needs both.
  #
  # - A pushed git tag publishes under that tag (the manual path).
  # - main publishes when the Dockerfile changed since the last release tag,
  #   i.e. Renovate merged an xmrig bump or a base-image digest bump. The tag is
  #   <xmrig version without v>-<UTC date>, with .2, .3, ... appended while that
  #   name is taken as a git tag or on Docker Hub, so a published tag never
  #   changes under anyone pinning it.
  #   "Since the last release tag" rather than "in this push" makes it
  #   self-healing: a run that failed verify or stopped early leaves no tag, so
  #   the next main push that changes the Dockerfile, or a workflow_dispatch on
  #   main, publishes instead. The `paths` filter on `push` already keeps other
  #   main pushes from running at all; this diff still decides for
  #   workflow_dispatch, and for the runs GitHub starts despite the filter (a
  #   push of over 1,000 commits, or a diff that timed out).
  # - Anything else (pull requests, other branches) publishes nothing.
  #
  # The tag, date included, is computed once, here, and read by both `merge` and
  # `tag`, so a run that crosses midnight UTC cannot give the image and its git
  # tag different dates. The build legs push by digest and never see it.
  # Only the Dockerfile is compared: also listing config.json, NOTICE and
  # LICENSE would be a second list to keep in step with its COPY lines. A change
  # to those alone ships with the next release, or with a manual tag push.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      tag: ${{ steps.decide.outputs.tag }}
      create_tag: ${{ steps.decide.outputs.create_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and every tag: `git describe` has to reach the last
          # release tag, and the collision check has to see every tag name.
          fetch-depth: 0
          persist-credentials: false
      - name: Decide
        id: decide
        run: |
          publish=false
          tag=
          create_tag=false
          case "$GITHUB_REF" in
            refs/tags/*)
              # `tag` stays empty: `merge` names this image from the ref itself.
              publish=true
              ;;
            refs/heads/main)
              last="$(git describe --tags --abbrev=0 \
                --match '[0-9]*-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]*' HEAD)" || {
                echo "::error::no release tag reachable from HEAD"; exit 1; }
              # git diff --quiet exits 0 (same), 1 (differs) or >1 (error). An
              # `if` would read an error as "differs" and publish, so every code
              # is handled explicitly.
              rc=0
              git diff --quiet "$last" HEAD -- Dockerfile || rc=$?
              case "$rc" in
                0)
                  echo "::notice::no release: Dockerfile unchanged since ${last}"
                  ;;
                1)
                  v="$(sed -n 's/^ARG XMRIG_VERSION="v\{0,1\}\([^"]*\)"/\1/p' Dockerfile)"
                  test -n "$v" || { echo "::error::could not read XMRIG_VERSION from Dockerfile"; exit 1; }
                  base="${v}-$(date -u +%F)"
                  tag="$base"
                  n=1
                  # A name is taken when its git tag exists OR Docker Hub already
                  # has it. Git alone misses one case: a `tag` job that failed after
                  # `merge` published leaves the image without its git tag, and the
                  # next same-day release would overwrite it. Any Hub answer other
                  # than 200 or 404 fails the job, as a git error does.
                  hub="https://hub.docker.com/v2/namespaces/${REGISTRY_IMAGE%%/*}"
                  hub="${hub}/repositories/${REGISTRY_IMAGE#*/}/tags"
                  taken() {
                    git rev-parse -q --verify "refs/tags/$1" >/dev/null && return 0
                    code="$(curl -sS --retry 3 --max-time 20 -o /dev/null -w '%{http_code}' "${hub}/$1")" ||
                      code=000
                    case "$code" in
                      200) return 0 ;;
                      404) return 1 ;;
                      *) echo "::error::Docker Hub lookup of $1 failed (HTTP ${code})"; exit 1 ;;
                    esac
                  }
                  while taken "$tag"; do
                    n=$((n + 1))
                    tag="${base}.${n}"
                  done
                  publish=true
                  create_tag=true
                  echo "::notice::publishing ${tag}: Dockerfile changed since ${last}"
                  ;;
                *)
                  echo "::error::git diff ${last} HEAD failed (exit ${rc})"
                  exit 1
                  ;;
              esac
              ;;
          esac
          {
            echo "publish=${publish}"
            echo "tag=${tag}"
            echo "create_tag=${create_tag}"
          } >> "$GITHUB_OUTPUT"

  build:
    if: needs.release.outputs.publish == 'true'
    needs:
      - verify
      - release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    # Native runners for both platforms — no QEMU. Emulating an xmrig compile
    # cost most of the tag build's wall clock, and `verify` needs a native
    # runner anyway to execute the arm64 binary it checks.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Prepare
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes to the repo, and the checkout is part of the
          # docker build context. Don't leave the job token in .git/config.
          persist-credentials: false
      - name: Read XMRig version
        id: xmrig
        run: |
          v="$(sed -n 's/^ARG XMRIG_VERSION="\([^"]*\)"/\1/p' Dockerfile)"
          test -n "$v" || { echo "could not read XMRIG_VERSION from Dockerfile"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # metadata-action's DEFAULT labels include org.opencontainers.image.licenses
      # (the repo's MIT licence) and .version (the git tag), and labels passed to
      # buildx override the Dockerfile's LABEL. Left to its defaults it publishes a
      # GPL-conveying image labelled MIT, and points NOTICE's corresponding-source
      # pointer at a tag that does not exist upstream. Both are pinned here.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.version=${{ steps.xmrig.outputs.version }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same scope `verify` wrote, so this reuses that compile instead of
          # repeating it. Cache lookup keys on the RUN command strings, and the
          # clone step includes the XMRIG_COMMIT check — so a moved upstream tag
          # still busts the cache rather than being served from it.
          cache-from: type=gha,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - release
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Explicit tags, not metadata-action's defaults, which would tag a main push
      # `:main`. A pushed git tag is named from the ref by type=ref, as before
      # this workflow published from main. An automatic release takes its name
      # from `release` through type=raw, because its git tag does not exist yet
      # (the `tag` job creates it afterwards). `release` leaves that name empty
      # on a tag push, and metadata-action skips an empty value. A manual tag
      # must never reach the type=raw line: each line is parsed as CSV, so a
      # comma in a valid git tag (`v1,x`) starts a new field that replaces the
      # value, and a `"` fails the parse. `latest` follows every publish, the
      # manual tag path included, as it did before.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ needs.release.outputs.tag }}
          flavor: latest=true
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046  # word splitting is the point: one -t per tag
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)
      # The pushed name, not the release output: metadata-action rewrites
      # characters a Docker tag cannot hold, so a manual git tag such as
      # `v1+x` is published as `v1-x`.
      - name: Inspect image
        env:
          TAG: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${TAG}"

  # Records an automatic release as a git tag on the commit it was built from,
  # which is also what the next run's `release` job compares against. A job of
  # its own so that contents: write sits beside no Docker Hub secret. Pushed with
  # GITHUB_TOKEN, so it starts no workflow run of its own — intended, because
  # the image is already published.
  tag:
    if: needs.release.outputs.create_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - release
      - merge
    permissions:
      contents: write
    steps:
      - name: Create git tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}"

  # Gated by `needs: merge` alone: a job without an explicit status check
  # runs only when every need succeeded, so it is skipped whenever nothing
  # was published.
  update_description:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - merge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update DockerHub repo description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.REGISTRY_IMAGE }}
