apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xmrig
  name: xmrig
  namespace: xmrig
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xmrig
  template:
    metadata:
      labels:
        app: xmrig
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - xmrig
              topologyKey: "kubernetes.io/hostname"
      containers:
        # Pin to a released tag from
        # https://hub.docker.com/r/ivuorinen/docker-xmrig/tags before production use.
        - image: ivuorinen/docker-xmrig:latest
          imagePullPolicy: Always
          name: xmrig
          # No command/args: the image's own CMD is the contract. Overriding it is
          # what pointed this manifest at /xmrig/xmrig, a path the image never had.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: "2Gi"
              cpu: "1"
            requests:
              memory: "1Gi"
              cpu: "1"
          # Liveness/readiness only: these catch a wedged or unresponsive process.
          # They do NOT detect a disconnected pool — the API answers at zero
          # hashrate, so a pod can still be Ready while mining nothing. Alert on
          # .connection.pool == "" from /2/summary externally; do not put it in the
          # probe, or a pool outage becomes a crashloop.
          livenessProbe:
            httpGet:
              path: /2/summary
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /2/summary
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            # Must be /etc/xmrig — the image's CMD reads /etc/xmrig/config.json.
            - name: config-volume
              mountPath: /etc/xmrig
            # readOnlyRootFilesystem needs a writable mount for the log file.
            - name: log
              mountPath: /log
      volumes:
        - name: config-volume
          configMap:
            name: xmrig-config
        - name: log
          emptyDir: {}
